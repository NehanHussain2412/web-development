<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML DOM</title>
</head>
<body>
    <h1>HTML DEMO</h1>
    <h2 id="demo">HEllo HTML</h2>
    <button onclick="myfunction()">click me</button>
    <h2 id="demo1">ZOO</h2>
    <br>
    <button onclick="disapear()">For disapear</button>
    <h2 id="demo2">Welcome to my page</h2>
<script>
    function myfunction(){
        document.getElementById("demo").innerHTML="Hello JS";
        document.getElementById("demo").style.color="brown";

}
function disapear(){
    document.getElementById("demo1").style.display="none";
    }
    document.getElementById("demo2").innerHTML="welcome to my zoo !"
</script>
    
</body>
</html>
