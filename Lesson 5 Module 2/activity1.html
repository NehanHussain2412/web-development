<!DOCTYPE html>
<html>
<head>
<title>My Animal Fact File</title>
<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: aquamarine;
}
.fact-file{
    background-color: azure;
    color: cadetblue;
    width: 260px;
    padding: 25px;
    border: 4px solid forestgreen;
    margin: 30px;
}
.Animal-name{
        color: chocolate;
        font-size: 22px;
}
.detail{
    color: darkorange;
}
.cool-fact{
    color: darkcyan;
    font-style: italic;
}
</style>
</head>
<body>
<div class="fact-file"><h2 class="Animal-name">White Tiger</h2>
<p class="detail">Type: Carnivore</p>
<p class="detail">lives in mountain Ranges of Central Asia</p>
<p class="detail">diet: deer,goats and wils sheeps</p>
<p class="cool-fact">Cool Fact: can leap upto 15 meters in one jump</p>
</div>
</body>
</html>
