<!DOCTYPE html>
<html>
<head>
<title>My hobby card</title>
<link rel="stylesheet"
href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<style>
body {
    font-family: cursive;
    font-weight: bolder;
    background-color: cornflowerblue;
    text-align: center;
    text-decoration: wavy;
    text-transform: capitalize;
    text-shadow: 5px 3px 3px black;
    color: greenyellow;
    
}
h1{
    text-align: center;

}
.hobby-card {
    border: 5px solid red;
    background-color: darkblue;
    padding: 10px 20px;
    font-size: 20px;
    margin: 15px 0 8px;
    top: 5px;
    border-radius: 8px;
    min-height: 250px;
}
</style>
</head>
<body>
<h1>My Hobby Card</h1>
<div class="container">
<div class="row">
<div class="col-12 col-md-6 col-lg-4">
<div class="hobby-card">
<h2>Gaming</h2>
<p>Play games like crazy all day multiple genres horror and survival eg Minecraft Roblox and Valorant</p>
</div>
</div>
<div class="col-12 col-md-6 col-lg-4">
<div class="hobby-card">
<h2>Eating</h2>
<p>Eating when im hungry</p>
</div>
</div>
<div class="col-12 col-md-6 col-lg-4">
<div class="hobby-card">
<h2>Thats it no more hobbies</h2>
<p>I know its incomplete but these hobbies are enough for me to survive a day</p>
</div>
</div>
</div>
</div>
</body>
</html>
