<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1 id="demo">Hello world</h1>
<script>
 var fruits=["kiwi","mango","banana"]
 fruits.push("apple");
 fruits.pop();
 fruits.sort();
 fruits.reverse();
 f=fruits.join("/");
document.getElementById("demo").innerHTML = f;
</script>
</body>
</html>
