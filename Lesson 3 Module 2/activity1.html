<!DOCTYPE html>
<html>
<head>
<title>My Superhero Card</title>
<style>
body {
    background-color: aqua;
    color: aliceblue;
    font-family: fantasy;
    text-transform: capitalize;
     font-weight: bolder;
}
.hero-name {
    font-size: 60px;
    color: darkred;
    text-shadow: 3px 3px goldenrod;
}
.tagline {
    font-size: 20px;color: brown;
}
.label {
    font-size: 30px;
    color: crimson;
    text-decoration: line-through;
}
.power {
    font-size: 30px;
    color: chocolate;
}
.weakness {
    color: firebrick;
}
.badge {
    font-size: 40px;color: darkorange;
    text-shadow:3px 3px firebrick;
    text-transform: uppercase;
    text-decoration: underline;
    transform: rotate(180deg);
}
.made-by {
    color: gold;
}
</style>
</head>
<body>
<h1 class="hero-name">Iron Man</h1>    
<p class="tagline">The most Intelligent person</p>
<h2 class="label">Super powers</h2>
<p class="powers">technology</p>
<p class="powers">Intelligence</p>
<h2 class="weakness">Strength</h2>
<p class="badge">Top hero</p>
<p class="made-by">Created By Nehan</p>
</body>
</html>
