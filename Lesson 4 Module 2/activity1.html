<!DOCTYPE html>
<html>
<head>
<title>My Food Menu</title>
<style>
body{
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-weight: bold;
    text-align: center;
    background-color: aquamarine;
}
h1{
    color: rgb(45, 6, 117);
}
h1+p {
     background-color: chartreuse;
     display: inline-block;
     border-radius: 8px;
     padding: 10px 20px;
     color: darkgreen;
     font-size: 40px;
}
ul>li{
     list-style:none;
     font-family: cursive;
     font-weight: bolder;
     font-size: 30px;
     padding: 10px 20px;
     border-radius: 8px;
     margin:6px auto;
     color: lightsalmon;

}
ul li:nth-child(1){
    background-color: chocolate;
}
ul {
    padding: 0%;
    margin-top: 20px
}
.desc{
    color: crimson;
}
.desc::first-letter{
    font-size: 30px;
    font-weight: bolder;
    font-family: unset;
}
.links{
    margin-top: 25px;

}
a{
    color: green;
    text-decoration: none;
    font-size: 20px;
    margin: 0 12px;
    padding: 8px 18px;
    border: 2px solid brown;
    border-radius: 8px;
}
a:hover{
    background-color: coral;
    color: darksalmon;
}
</style>
</head>
<body>
<h1>My Food Menu</h1>
<p>Take ur fav dish and Dig in</p>
<ul>
<li>Pepporini Pizza Chef's Special</li>
<li>Alfredo Pasta</li>
<li>French Fries</li>
<li>Cheese Burger</li>
<li>Chocolate Mousse</li>
</ul>
<p class="desc">Every dish on this menu is made with pure love and alot of flavours. Try them all and find ur flavour</p>
<div class="links">
<a href="#">Taste Now</a>
<a href="#">See more Items</a>
</div>
</body>
</html>
