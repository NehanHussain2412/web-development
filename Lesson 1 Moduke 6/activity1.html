<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Playlist Order</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<style>
body {
    font-family: cursive;
    background-color: cornflowerblue;
}
h1,h2 {
    color: darkviolet;
}
.box {
    color: chartreuse;
}
</style>
</head>
<body>
<div class="container py-4"></div>
<h1 class="mb-4">My Playlist Order</h1>
<div class="card mb-4">
    <div class="card-body">
        <h3 class="card-title">My Favorite Songs</h3>
        <button class="btn btn-primary mr-2" onclick="sortAtoZ()">Sort A-Z</button>
        <button class="btn btn-primary" onclick="sortZtoA()">Sort Z-A</button>
        <div id="countResult" class="box p-3 mt-3  rounded"></div>
    </div>
</div>
<div class="card mb-4">
    <div class="card-body">
        <h3 class="card-title">Play Counts</h3>
        <button class="btn btn-primary mr-2" onclick="sortLeast()">Sort Least </button>
       <button class="btn btn-primary mr-2" onclick="sortMost()">Sort Most </button>
       <div id="countResult" class="box p-3 mt-3  rounded"></div>
    </div>
<div class="card mb-4">
<div class="card-body">
<h3 class="card-title">Label Every Play Count</h3>
<button class="btn btn-primary" onclick="addLabel()">Add play Labels</button>
  <div id="countResult" class="box p-3 mt-3  rounded"></div>
</div>
</div>
<script>
var songs = ["Zoom", "Bounce", "Glow", "Rush", "Spark"]; // TOPIC 1 & 2
var plays = [320, 85, 210, 50, 175]; // TOPIC 3
document.getElementById("nameResult").innerHTML = "Songs: " + songs;
document.getElementById("countResult").innerHTML = "Plays: " + plays;
document.getElementById("labelResult").innerHTML = "Press the button above!";
function sortAZ() { songs.sort(); document.getElementById("nameResult").innerHTML = "A to Z: " + songs; }
function sortZA() { songs.sort(); songs.reverse(); document.getElementById("nameResult").innerHTML = "Z to A: " + songs; }
function sortLeast() { plays.sort(function (a, b) { return a - b; });
document.getElementById("countResult").innerHTML = "Least played first: " + plays; }
function sortMost() { plays.sort(function (a, b) { return b - a; });
document.getElementById("countResult").innerHTML = "Most played first: " + plays; }
function addLabel() { var l = plays.map(function (c) { return c + " plays"; });
document.getElementById("labelResult").innerHTML = "Labelled: " + l; }
</script>
</body>
</html>
